#
# Description: Release Please: opens/updates a Release PR from conventional commits.
# When the Release PR is merged, publishes pre-built Release binary artifacts
# for all supported platforms to the GitHub Release.
# Two-tier release model:
#   Tier 1 — source consumers: pin the release tag as a git submodule.
#   Tier 2 — binary consumers: download .tar.gz from GitHub Releases.
# Repo Settings required (one-time):
#   Settings → General → Pull Requests → "Allow auto-merge" — ON
#   REPO_ACCESS_TOKEN (optional): use for higher limits; else github.token is used.
#
# Autodoc:   yes
# ----------------------------------------------------------------------

name: Release Please

on:
  push:
    branches: ["main"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # NEVER cancel an in-progress release

permissions:
  contents: write
  pull-requests: write

jobs:
  # --------------------------------------------------------------------
  # Stage 1: Create or update the Release PR via release-please.
  #          Auto-merge it once all required CI checks pass.
  # --------------------------------------------------------------------
  release-please:
    name: "Release / release-please"
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name:        ${{ steps.rp.outputs.tag_name }}
      version:         ${{ steps.rp.outputs.version }}
    steps:
      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: .github/release-please-config.json
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      # Enable auto-merge so the Release PR merges once CI Gate passes. If the repo
      # has not enabled "Allow auto-merge" (Settings → General, and Branches → main),
      # we warn and leave the PR open for manual merge instead of failing the workflow.
      - name: Enable auto-merge on Release PR
        if: steps.rp.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}
          PR_RAW: ${{ steps.rp.outputs.pr }}
        run: |
          PR_NUMBER="$(echo "$PR_RAW" | python3 -c 'import sys,json; print(json.load(sys.stdin)["number"])')"
          if ! gh pr merge --repo "${{ github.repository }}" --auto --squash "$PR_NUMBER" 2>&1 | tee /tmp/gh-out; then
            if grep -q "enablePullRequestAutoMerge\|Auto merge is not allowed" /tmp/gh-out; then
              echo "::warning::Auto-merge is disabled for this repo. Enable it under Settings → General → Pull Requests → 'Allow auto-merge'. Release PR #$PR_NUMBER remains open for manual merge."
              exit 0
            fi
            exit 1
          fi

  # --------------------------------------------------------------------
  # Stage 2: Build and publish artifacts (only when a release was created this run).
  # Same platform matrix as vneio: build/shared/Release (static iOS in
  # build/static/Release). Uses -DVNE_SCENE_STANDALONE_INSTALL=ON: PIC-static
  # internal deps are linked into libvnescene; cmake --install stages vnescene-only
  # (bundled math/common headers, no separate dep libs or FindVneMath packages).
  # --------------------------------------------------------------------
  publish:
    name: "Release / publish (${{ matrix.platform }})"
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-gcc
            runner: ubuntu-latest
            build_dir: build/shared/Release
            c: gcc
            cpp: g++
          - platform: macos
            runner: macos-latest
            build_dir: build/shared/Release
            c: ""
            cpp: ""
          - platform: windows
            runner: windows-latest
            build_dir: build/shared/Release
            c: ""
            cpp: ""
          - platform: web-emscripten
            runner: ubuntu-latest
            build_dir: build/shared/Release
            c: ""
            cpp: ""
          - platform: ios-static
            runner: macos-latest
            build_dir: build/static/Release
            c: ""
            cpp: ""
          - platform: android
            runner: ubuntu-latest
            build_dir: build/shared/Release
            c: ""
            cpp: ""
            android_platform: android-24

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Use HTTPS for GitHub (CI runners have no SSH key)
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          submodules: recursive

      - name: Setup Android NDK
        if: matrix.platform == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d

      - name: Select Xcode 26 (macOS + iOS)
        if: matrix.platform == 'macos' || matrix.platform == 'ios-static'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Verify Xcode (iOS release)
        if: matrix.platform == 'ios-static'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux-gcc'
        run: sudo apt-get update -qq && sudo apt-get install -y build-essential cmake

      - name: Install Emscripten
        if: matrix.platform == 'web-emscripten'
        uses: mymindstorm/setup-emscripten@v14

      - name: Configure CMake (Linux / macOS / Windows desktop)
        if: matrix.platform != 'web-emscripten' && matrix.platform != 'ios-static' && matrix.platform != 'android'
        shell: bash
        env:
          INSTALL_PREFIX: ${{ github.workspace }}/install
        run: |
          set -e
          COMPILER_FLAGS=""
          if [[ -n "${{ matrix.c }}" ]]; then
            COMPILER_FLAGS="-DCMAKE_C_COMPILER=${{ matrix.c }} -DCMAKE_CXX_COMPILER=${{ matrix.cpp }}"
          fi
          BUILD_DIR="${{ matrix.build_dir }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cmake -B "$BUILD_DIR" -S . -G "Visual Studio 17 2022" -A x64 \
              -DVNE_SCENE_CI=ON \
              -DVNE_SCENE_LIB_TYPE=shared \
              -DVNE_SCENE_TESTS=OFF \
              -DVNE_SCENE_STANDALONE_INSTALL=ON \
              -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX" \
              $COMPILER_FLAGS
          else
            cmake -B "$BUILD_DIR" -S . \
              -DCMAKE_BUILD_TYPE=Release \
              -DVNE_SCENE_CI=ON \
              -DVNE_SCENE_LIB_TYPE=shared \
              -DVNE_SCENE_TESTS=OFF \
              -DVNE_SCENE_STANDALONE_INSTALL=ON \
              -DENABLE_IPO=OFF \
              -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX" \
              $COMPILER_FLAGS
          fi

      - name: Configure CMake (Android)
        if: matrix.platform == 'android'
        shell: bash
        env:
          INSTALL_PREFIX: ${{ github.workspace }}/install
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_ROOT}"
          if [[ -z "$NDK" || ! -f "$NDK/build/cmake/android.toolchain.cmake" ]]; then
            echo "::error::Android NDK path invalid (ANDROID_NDK_ROOT=${NDK:-empty})"
            exit 1
          fi
          cmake -B "${{ matrix.build_dir }}" -S . \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=${{ matrix.android_platform }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DVNE_SCENE_CI=ON \
            -DVNE_SCENE_LIB_TYPE=shared \
            -DVNE_SCENE_TESTS=OFF \
            -DVNE_SCENE_STANDALONE_INSTALL=ON \
            -DENABLE_IPO=OFF \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX"

      - name: Configure CMake (Emscripten)
        if: matrix.platform == 'web-emscripten'
        shell: bash
        env:
          INSTALL_PREFIX: ${{ github.workspace }}/install
        run: |
          cmake -B "${{ matrix.build_dir }}" -S . \
            -DCMAKE_TOOLCHAIN_FILE="$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DVNE_SCENE_CI=ON \
            -DVNE_SCENE_LIB_TYPE=shared \
            -DVNE_SCENE_TESTS=OFF \
            -DVNE_SCENE_STANDALONE_INSTALL=ON \
            -DENABLE_IPO=OFF \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX"

      - name: Configure CMake (iOS)
        if: matrix.platform == 'ios-static'
        shell: bash
        env:
          INSTALL_PREFIX: ${{ github.workspace }}/install
        run: |
          set -euxo pipefail
          cmake -B "${{ matrix.build_dir }}" -S . \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_VERBOSE_MAKEFILE=ON \
            -DVNE_SCENE_CI=ON \
            -DVNE_SCENE_LIB_TYPE=static \
            -DVNE_SCENE_TESTS=OFF \
            -DVNE_SCENE_STANDALONE_INSTALL=ON \
            -DENABLE_IPO=OFF \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX"

      - name: Build
        shell: bash
        run: |
          set -e
          BDIR="${{ matrix.build_dir }}"
          if [[ "${{ matrix.platform }}" == "ios-static" ]]; then
            cmake --build "$BDIR" --config Release --parallel --verbose
          else
            cmake --build "$BDIR" --config Release --parallel
          fi

      - name: Install to staging directory
        shell: bash
        run: |
          set -e
          BDIR="${{ matrix.build_dir }}"
          WS="${{ github.workspace }}"
          # Standalone layout: vnescene library + headers (deps skipped at install; math/common bundled).
          if [[ "${{ matrix.platform }}" == "ios-static" ]]; then
            cmake --install "$BDIR" --config Release --verbose
          else
            cmake --install "$BDIR" --config Release
          fi
          INSTALL="$WS/install"
          if [[ ! -d "$INSTALL/include/vertexnova" ]]; then
            echo "::error::Expected install/include/vertexnova missing."
            find "$INSTALL" -type f 2>/dev/null | sort | head -80
            exit 1
          fi
          for f in LICENSE CHANGELOG.md; do
            if [[ ! -f "$INSTALL/$f" ]]; then
              echo "::error::Expected install/$f missing."
              find "$INSTALL" -type f 2>/dev/null | sort | head -80
              exit 1
            fi
          done
          case "${{ matrix.platform }}" in
            web-emscripten)
              if [ -z "$(find "$INSTALL" -type f \( -name '*.wasm' -o -name '*.a' -o -name '*.js' \) -print -quit)" ]; then
                echo "::error::Web install: expected some of .wasm / .a / .js under install/"
                find "$INSTALL" -type f | sort
                exit 1
              fi
              ;;
            ios-static)
              if [ -z "$(find "$INSTALL" -type f -name '*.a' -print -quit)" ]; then
                echo "::error::iOS install: expected at least one .a under install/"
                find "$INSTALL" -type f 2>/dev/null | sort || true
                exit 1
              fi
              ;;
            *)
              # Require vnescene shared/import library only (internal deps linked in; no separate dep libs).
              if [ -z "$(find "$INSTALL" -type f \( \
                  -iname '*vnescene*.so' -o -iname '*vnescene*.dylib' -o -iname '*vnescene*.dll' -o -iname '*vnescene*.lib' \
                \) -print -quit)" ]; then
                echo "::error::No vnescene library binary (.so/.dylib/.dll/.lib) found under install/."
                find "$INSTALL" -type f | sort
                exit 1
              fi
              ;;
          esac

      - name: Package artifact
        shell: bash
        run: |
          ARTIFACT="vnescene-v${{ needs.release-please.outputs.version }}-${{ matrix.platform }}.tar.gz"
          tar -czf "${ARTIFACT}" -C "${{ github.workspace }}/install" .
          echo "ARTIFACT=${ARTIFACT}" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: ${{ env.ARTIFACT }}
